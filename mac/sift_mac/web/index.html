<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift review</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
body { margin: 0; padding: 0 16px 48px; }
main { max-width: 1400px; margin: 0 auto; }
.sub { color: var(--muted); font-size: 12px; }
nav, .tabs, .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
/* Buttons outside a .bar: the step and group chips, page actions. */
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
button:hover { background: var(--hover); }
button:disabled { opacity: .4; cursor: default; }
button.chip { border-radius: 999px; }
button[aria-pressed="true"] { background: var(--pressed); border-color: var(--fg); }
button.primary { border-color: var(--accent); }
button:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { margin: 10px 0 12px; }
/* Rows of equal height; each tile takes its photo's own width, so nothing is cropped. */
.grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { position: relative; height: 320px; max-width: 100%; min-width: 120px; border-radius: 6px; overflow: hidden; background: var(--tile); border: 3px solid var(--delete); padding: 0; cursor: pointer; }
.tile img { height: 100%; width: auto; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
.tile .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--delete); color: var(--table); font-weight: 600; }
.tile.keep, .tile.best { border-color: var(--keep); }
.tile.keep img { opacity: .4; }
.tile.best .badge, .tile.keep .badge { background: var(--keep); }
/* Grid's steps sit inside the Grid segment of the view switcher: a sub-menu of the active view. */
.bar .grp { display: flex; flex-wrap: nowrap; align-items: center; gap: 2px; background: var(--pressed); border-radius: 6px; padding-right: 2px; }
.bar .grp > a[aria-current="page"] { background: transparent; font-weight: 600; }
.steps { display: flex; flex-wrap: nowrap; gap: 2px; padding-left: 4px; border-left: 1px solid var(--line); }
.steps button { padding: 3px 8px; font-size: 13px; }
.steps button[aria-pressed="true"] { background: var(--panel); }
/* Sticky header in the table's style: view switcher, steps, theme, Apply top right. */
.top { position: sticky; top: 0; z-index: 5; padding: 10px 0; display: flex; gap: 10px; align-items: center; background: var(--table); border-bottom: 1px solid var(--line); }
/* The bars never wrap inside; when the row is too narrow, Apply and its message move to a row of their own. */
.top { flex-wrap: wrap; }
.top > .bar { flex: none; flex-wrap: nowrap; white-space: nowrap; }
.applyarea { flex: 1 1 380px; display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; min-width: 0; }
.applyarea .actions { flex: none; flex-wrap: nowrap; white-space: nowrap; }
.applyarea .msg { flex: 1; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.intro { margin: 10px 6px 4px; }
.msg { font-size: 12px; color: var(--muted); }
.msg.err { color: var(--delete); }
.runs { margin-top: 32px; font-size: 12px; color: var(--muted); }
.runs li { margin: 4px 0; }
.break { flex-basis: 100%; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 4px; margin-top: 6px; }
.break:empty { display: none; }
.pair { display: flex; flex-wrap: wrap; gap: 12px; }
.pair figure { margin: 0; flex: 1 1 360px; min-width: 0; background: var(--tile); border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 62vh; }
.pair img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.empty { padding: 40px 0; color: var(--muted); }
.empty a { color: var(--accent); }
footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
/* Events step: one row per pile, the same piles as the table. */
.events { display: grid; gap: 10px; }
.event { display: grid; grid-template-columns: 150px minmax(0, 1fr) 260px; gap: 14px; padding: 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.event .when b { font-weight: 600; }
.evname { color: var(--event); font-weight: 600; font-style: italic; }
.evname.album { font-style: normal; } .evname.album::before { content: "▣ "; }
.evname.none { color: var(--muted); font-weight: 500; }
.strip { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0 6px; align-items: center; }
.strip img { height: 120px; width: auto; border-radius: 4px; background: var(--tile); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 8px; border-radius: 999px; background: var(--pressed); font-size: 12px; }
.tag.album { padding-right: 8px; } .tag.new { outline: 1.5px dashed var(--accent); }
.tag button { border: 0; background: transparent; padding: 0 5px; color: var(--muted); }
.acts { display: grid; gap: 6px; align-content: start; align-self: start; position: sticky; top: calc(var(--toph, 72px) + 12px); }
.when { align-self: start; position: sticky; top: calc(var(--toph, 72px) + 12px); }
.acts input { font: inherit; color: var(--fg); background: var(--hover); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; outline: none; width: 100%; }
.acts input:focus { border-color: var(--accent); }
.event.split { display: block; }
.event.split > .cols { display: grid; grid-template-columns: 150px minmax(0, 1fr) 260px; gap: 14px; }
.event.split > .foot { margin-top: 12px; }
.event .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.foot .grow { flex: 1; }
.foot .danger { color: var(--delete); }
.foot .keep { color: var(--keep); font-weight: 600; }
.place { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 4px; font-size: 13px; }
.place .set, .place.set { color: var(--keep); } .place .none, .place.none { color: var(--muted); }
.place button { padding: 1px 8px; font-size: 12px; }
.place button.use { color: var(--accent); }
.place .placebtn { font: inherit; font-size: 13px; padding: 1px 6px; border: 1px dashed transparent; border-radius: 6px; background: transparent; cursor: text; }
.place .placebtn:hover { border-color: var(--line); background: var(--hover); }
.place .placebtn.set { color: var(--keep); } .place .placebtn.none { color: var(--muted); } .place .placebtn.sug { color: var(--fg); }
.place .placeedit { font: inherit; font-size: 13px; color: var(--fg); background: var(--hover); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 8px; width: 300px; max-width: 100%; outline: none; }
.spot { margin-top: 8px; }
.place.gps { color: var(--muted); }
.selbox { display: grid; gap: 6px; padding: 8px; border: 1.5px solid var(--accent); border-radius: 8px; }
.selbox .danger { color: var(--delete); }
.selbox { justify-items: stretch; }
.pile { position: relative; height: 150px; display: grid; place-items: center; }
.pile img { grid-area: 1 / 1; max-width: 190px; max-height: 128px; border: 3px solid var(--panel); border-radius: 5px; box-shadow: 0 6px 18px #0004; background: var(--tile); }
.selcount { text-align: center; } .selcount b { color: var(--accent); }
.pile { cursor: zoom-in; }
/* Loading: the button that started a save spins; its event dims until the list is back. */
button.busy { cursor: progress; opacity: 1 !important; }
button.busy::after { content: ""; display: inline-block; width: .8em; height: .8em; margin-left: 7px; vertical-align: -1px;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.event.working { opacity: .55; pointer-events: none; transition: opacity .2s; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { button.busy::after { animation-duration: 2s; } }
.focuscount { font-size: 13px; color: var(--muted); } .focuscount b { color: var(--accent); }
.event .strip .ph { cursor: zoom-in; }
.event .strip .ph[title^="Click to add"] { cursor: copy; }
.focus { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; cursor: zoom-out;
  background: color-mix(in srgb, var(--table) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.focusstage { display: flex; gap: 24px; align-items: center; padding: 16px; }
.focusimg { display: block; border-radius: 10px; box-shadow: 0 30px 80px #0007; background: var(--tile); object-fit: contain; cursor: default; }
.focuspanel { width: 300px; display: grid; gap: 10px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: default; }
.focuspanel h3 { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.focuspanel .placeedit { width: 100%; }
.focuspanel .danger { color: var(--delete); }
/* Album chips: the same chip in the large view (the event's album is its title) and in the selection box. */
.achips { display: flex; flex-wrap: wrap; gap: 4px; }
.achip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--pressed); font-size: 12px; }
.achip.k-event, .achip.k-add { outline: 1.5px dashed var(--accent); } .achip.k-own { color: var(--muted); }
.achip.removed .aname { text-decoration: line-through; color: var(--muted); }
.achip .rm { display: none; border: 0; background: transparent; padding: 0; font-size: 12px; font-weight: 500; font-style: normal; color: var(--delete); cursor: pointer; }
.achip .rm.back { color: var(--accent); }
.achip:hover .rm, .achip:focus-within .rm, .achip .rm.busy { display: inline-block; }
.achip.astitle { display: flex; background: none; outline: 0; padding: 0; font-size: inherit; color: var(--event); font-weight: 600; }
.seclabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
@media (max-width: 800px) { .focusstage { flex-direction: column; } .focuspanel { width: min(300px, calc(100vw - 32px)); } }
.spot .strip { margin-top: 4px; }
.strip .ph { padding: 0; border: 0; background: transparent; border-radius: 4px; position: relative; line-height: 0; outline-offset: -3px; }
.strip .ph img { display: block; }
.strip .ph.picked { outline: 3px solid var(--accent); }
.strip .ph.sug { outline: 2px dashed var(--event); }
.strip .ph .open { padding: 0; border: 0; background: none; line-height: 0; border-radius: inherit; cursor: zoom-in; }
.strip .ph .heart { position: absolute; left: 4px; bottom: 4px; width: 30px; height: 30px; padding: 5px; border: 0; background: none; line-height: 0; cursor: pointer; opacity: 0; transition: opacity .15s, transform .15s; }
.strip .ph .heart svg { width: 100%; height: 100%; fill: none; stroke: #fff; stroke-width: 2; filter: drop-shadow(0 1px 2px #000a); }
.strip .ph:hover .heart, .strip .ph .heart:focus-visible, .strip .ph.fav .heart { opacity: 1; }
.strip .ph .heart:hover { transform: scale(1.12); }
.strip .ph.fav .heart svg { fill: #fff; }
.strip .ph.pick .heart svg { fill: var(--event); stroke: var(--event); }
.strip .ph.pick { outline: 3px solid var(--event); }
@media (max-width: 900px) { .event, .event.split > .cols { grid-template-columns: 1fr; } .acts, .when { position: static; } }
footer a { color: inherit; }
</style>
<main>
<header class="top">
  <nav class="bar" aria-label="View">
    <span class="grp"><a href="/" aria-current="page">Grid</a>
      <span class="steps" role="group" aria-label="Grid steps">
        <button id="nav-junk" aria-pressed="true">1 Junk</button>
        <button id="nav-dupes" aria-pressed="false">2 Duplicates</button>
        <button id="nav-events" aria-pressed="false">3 Events</button>
        <button id="nav-best" aria-pressed="false">4 Best-of</button>
      </span></span>
    <a href="/table#pile">Pile</a><a href="/table#events">Events</a><a href="/table#look">Visual</a><a href="/table#time">Time</a>
  </nav>
  <div class="bar"><button data-theme-toggle></button></div>
  <div class="applyarea" id="junkapply">
    <span class="actions" id="applybox"></span>
    <span class="msg" id="msg"></span>
  </div>
  <div class="applyarea" id="eventsapply" hidden>
    <span class="actions" id="eventsapplybox"></span>
    <span class="msg" id="eventsmsg"></span>
  </div>
  <div class="applyarea" id="dupesapply" hidden>
    <span class="actions" id="dupesapplybox"></span>
    <span class="msg" id="dupesmsg"></span>
  </div>
</header>
<p class="sub intro">Nothing is written to Photos until <b>Apply to Photos</b>.</p>
<section id="junkview">
<p class="sub intro">Click a photo to keep it.</p>
<div class="tabs" id="tabs" role="group" aria-label="Junk groups"></div>
<div class="tabs" id="sections" role="group" aria-label="Sections"></div>
<div class="actions" id="pageinfo"></div>
<div class="grid" id="grid" style="margin-top:12px"></div>
<div class="actions" id="pageinfo2" style="margin-top:12px"></div>
<div class="runs"><b>Applied runs</b><ul id="runs"></ul></div>
</section>
<section id="dupesview" hidden>
  <div class="tabs" role="group" aria-label="Mode">
    <button class="chip" id="modereview" aria-pressed="true">Review sets</button>
    <button class="chip" id="modelabel" aria-pressed="false">Label pairs</button>
  </div>
  <div id="reviewmode">
    <div class="tabs" id="tiertabs" role="group" aria-label="Tiers"></div>
    <div class="actions" id="setinfo"></div>
    <div class="grid" id="setgrid" style="margin-top:12px"></div>
    <div class="actions" id="setinfo2" style="margin-top:12px"></div>
    <div class="runs"><b>Applied runs</b><ul id="duperuns"></ul></div>
  </div>
  <div id="labelmode" hidden>
    <p class="msg" id="labelinfo"></p>
    <div class="pair" id="pair"></div>
    <div class="actions" id="labelactions" style="margin-top:12px"></div>
  </div>
</section>
<section id="eventsview" hidden>
  <div class="tabs" id="eventsfilters" role="group" aria-label="Which events"></div>
  <div id="eventslist" class="events"></div>
</section>
<datalist id="tagindex"></datalist><datalist id="albumindex"></datalist>
<footer>Place names: <a href="https://www.geonames.org/">GeoNames</a>, CC BY 4.0.</footer>
</main>
<script src="/progress.js"></script>
<script src="/app.js"></script>
<script src="/dupes.js"></script>
<script src="/events.js"></script>
</html>
