[project]
name = "sift-mac"
version = "0.1.0"
description = "Local companion to Photos.app: finds junk, near-duplicates and events, and writes approved metadata back."
requires-python = ">=3.12"
dependencies = [
    "osxphotos>=0.78.1",
    "photoscript>=0.6.1",
    "huggingface_hub>=0.30",
    "numpy>=2",
    "pillow>=11",
    "scipy>=1.18.1",
]

[project.scripts]
sift-mac = "sift_mac.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "piexif>=1.1.3",
    "ruff>=0.17.5",
]
# EmbeddingGemma 2 image input needs these unreleased revisions (spike, 2026-11-11). Only `bench dupes` uses them.
bench = [
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@3d87e88402f307efbf68e568971aa887ee7d9ed0",
    "mlx>=0.32.3",
    "transformers @ git+https://github.com/huggingface/transformers.git@28ec08c4699e521aaecab9265af861077f670ac0",
    "torch",
    "torchvision",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["photos: needs Photos.app open on the Sift Test library"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["E731", "E741", "B905"]  # terse lambdas, short names and zip() are this codebase's style
